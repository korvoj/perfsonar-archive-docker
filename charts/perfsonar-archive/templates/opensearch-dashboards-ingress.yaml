{{- if .Values.opensearchDashboards.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-opensearch-dashboards
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.opensearchDashboards.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.opensearchDashboards.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.opensearchDashboards.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "perfsonar-archive.fullname" $ }}-opensearch-dashboards
                port:
                  number: 5601
          {{- end }}
    {{- end }}
  {{- with .Values.opensearchDashboards.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
