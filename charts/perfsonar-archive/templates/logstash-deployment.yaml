apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-logstash
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  {{- with .Values.logstash.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: logstash
          image: {{ .Values.logstash.image.repository }}:{{ .Values.logstash.image.tag }}
          imagePullPolicy: {{ .Values.logstash.image.pullPolicy }}
          env:
            - name: MONITORING_ENABLED
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: RATE_CACHE_MAX_ENTRIES
              value: "10000000"
            - name: RATE_CACHE_EXPIRES
              value: "600"
            - name: opensearch_output_host
              value: "https://{{ include "perfsonar-archive.fullname" . }}-opensearch-node"
            - name: opensearch_output_user
              value: {{ .Values.logstash.opensearch_output_user }}
            - name: opensearch_output_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "perfsonar-archive.fullname" . }}-logstash-credentials
                  key: password
          ports:
            - containerPort: 11283
          {{- with .Values.logstash.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.logstash.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.logstash.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
